# The whole system on a server: database, application, and Caddy in front of it
# for HTTPS. Caddy gets a certificate on its own and renews it, so there is no
# certificate to remember.
#
#   cp .env.example .env     and fill it in
#   docker compose up -d
#
# Run it from the project root:  docker compose -f deploy/docker-compose.yml up -d

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: 480
      ENVIRONMENT: production
      CORS_ORIGINS: https://${DOMAIN}
      APP_TIMEZONE: Africa/Lusaka
    volumes:
      - uploads:/srv/backend/uploads
      - backups:/srv/backups

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  database:
  uploads:
  backups:
  caddy_data:
  caddy_config:
