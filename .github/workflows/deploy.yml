name: Deploy Green Buffet demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the site
        run: |
          unzip -o greenbuffet-pages.zip -d tmp
          src=$(dirname "$(find tmp -name index.html -not -path '*__MACOSX*' | head -1)")
          mkdir -p site && cp -r "$src"/. site/
          ls -la site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
